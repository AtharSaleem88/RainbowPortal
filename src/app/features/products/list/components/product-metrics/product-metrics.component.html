<div class="row g-3 mb-3">
  <!-- Card 1: Total SKUs -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Total Products</span>
        <div class="cat-metric-icon bg-primary-subtle text-primary">
          <iconify-icon icon="solar:box-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ totalProductsCount }}</div>
      <small class="text-muted fs-11">Active supermarket SKUs</small>
    </div>
  </div>

  <!-- Card 2: Total Network Stock Units -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Network Stock</span>
        <div class="cat-metric-icon bg-info-subtle text-info">
          <iconify-icon icon="solar:cart-large-4-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ totalStockUnits | number }}</div>
      <small class="text-muted fs-11">Consolidated units across stores</small>
    </div>
  </div>

  <!-- Card 3: In-Stock SKUs -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">In-Stock Rate</span>
        <div class="cat-metric-icon bg-success-subtle text-success">
          <iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ inStockCount }} <span class="fs-13 text-muted fw-normal">SKUs</span></div>
      <small class="text-muted fs-11">Ready for app ordering</small>
    </div>
  </div>

  <!-- Card 4: Multi-Branch Fulfillment -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Superstore Hubs</span>
        <div class="cat-metric-icon bg-warning-subtle text-warning">
          <iconify-icon icon="solar:point-on-map-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ branchCount }} <span class="fs-13 text-muted fw-normal">Locations</span></div>
      <small class="text-muted fs-11">Active Karachi branches</small>
    </div>
  </div>
</div>
