<div class="row g-2 g-md-3 mb-3">
  <!-- Card 1: Sub-Sub Categories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Sub-Sub Cats</span>
        <div class="cat-metric-icon bg-primary-subtle text-primary">
          <iconify-icon icon="solar:tag-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ totalSubSubCategories }}</div>
      <small class="text-muted metric-subtext d-none d-sm-block">Micro classifications</small>
    </div>
  </div>

  <!-- Card 2: Master Categories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Master Categories</span>
        <div class="cat-metric-icon bg-info-subtle text-info">
          <iconify-icon icon="solar:folder-with-files-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ masterCategoriesCount }} <span class="fs-12 text-muted fw-normal d-none d-sm-inline">Depts</span></div>
      <small class="text-muted metric-subtext d-none d-sm-block">Supermarket departments</small>
    </div>
  </div>

  <!-- Card 3: Active Classifications -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Active Items</span>
        <div class="cat-metric-icon bg-success-subtle text-success">
          <iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ activeSubSubCount }} <span class="fs-12 text-muted fw-normal d-none d-sm-inline">Live</span></div>
      <small class="text-muted metric-subtext d-none d-sm-block">App consumer filter active</small>
    </div>
  </div>

  <!-- Card 4: Parent Subcategories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Linked Subcats</span>
        <div class="cat-metric-icon bg-warning-subtle text-warning">
          <iconify-icon icon="solar:layers-minimalistic-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ subCategoriesCount }} <span class="fs-12 text-muted fw-normal d-none d-sm-inline">Groups</span></div>
      <small class="text-muted metric-subtext d-none d-sm-block">Secondary branch levels</small>
    </div>
  </div>
</div>
