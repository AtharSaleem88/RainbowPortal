<div class="row g-3 mb-3">
  <!-- Card 1: Sub-Sub Categories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Sub-Sub Cats</span>
        <div class="cat-metric-icon bg-primary-subtle text-primary">
          <iconify-icon icon="solar:tag-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ totalSubSubCategories }}</div>
      <small class="text-muted fs-11">Micro classifications</small>
    </div>
  </div>

  <!-- Card 2: Master Categories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Master Categories</span>
        <div class="cat-metric-icon bg-info-subtle text-info">
          <iconify-icon icon="solar:folder-with-files-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ masterCategoriesCount }} <span class="fs-13 text-muted fw-normal">Depts</span></div>
      <small class="text-muted fs-11">Supermarket departments</small>
    </div>
  </div>

  <!-- Card 3: Active Classifications -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Active Items</span>
        <div class="cat-metric-icon bg-success-subtle text-success">
          <iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ activeSubSubCount }} <span class="fs-13 text-muted fw-normal">Live</span></div>
      <small class="text-muted fs-11">App consumer filter active</small>
    </div>
  </div>

  <!-- Card 4: Parent Subcategories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Linked Subcats</span>
        <div class="cat-metric-icon bg-warning-subtle text-warning">
          <iconify-icon icon="solar:layers-minimalistic-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ subCategoriesCount }} <span class="fs-13 text-muted fw-normal">Subcats</span></div>
      <small class="text-muted fs-11">Across parent divisions</small>
    </div>
  </div>
</div>
