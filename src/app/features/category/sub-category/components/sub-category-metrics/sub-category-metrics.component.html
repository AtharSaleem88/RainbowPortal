<div class="row g-3 mb-3">
  <!-- Card 1: Total Sub Categories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Subcategories</span>
        <div class="cat-metric-icon bg-primary-subtle text-primary">
          <iconify-icon icon="solar:layers-minimalistic-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ totalSubCategories }}</div>
      <small class="text-muted fs-11">Across 20 departments</small>
    </div>
  </div>

  <!-- Card 2: Active Subcategories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Active Subcats</span>
        <div class="cat-metric-icon bg-success-subtle text-success">
          <iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ activeSubCount }} <span class="fs-13 text-muted fw-normal">Live</span></div>
      <small class="text-muted fs-11">Consumer catalog enabled</small>
    </div>
  </div>

  <!-- Card 3: Total Products -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Catalog SKUs</span>
        <div class="cat-metric-icon bg-info-subtle text-info">
          <iconify-icon icon="solar:box-minimalistic-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ totalProducts | number }}</div>
      <small class="text-muted fs-11">Total supermarket items</small>
    </div>
  </div>

  <!-- Card 4: Master Departments -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Master Depts</span>
        <div class="cat-metric-icon bg-warning-subtle text-warning">
          <iconify-icon icon="solar:widget-2-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ masterDepartmentsCount }} <span class="fs-13 text-muted fw-normal">Groups</span></div>
      <small class="text-muted fs-11">Primary store divisions</small>
    </div>
  </div>
</div>
