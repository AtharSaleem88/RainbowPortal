<div class="row g-3 mb-3">
  <!-- Card 1: Total Brands -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">All Brands</span>
        <div class="cat-metric-icon bg-primary-subtle text-primary">
          <iconify-icon icon="solar:shop-2-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ brandsCount }}</div>
      <small class="text-muted fs-11">Registered manufacturers</small>
    </div>
  </div>

  <!-- Card 2: Active Brands -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Active Brands</span>
        <div class="cat-metric-icon bg-success-subtle text-success">
          <iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ activeBrandsCount }}</div>
      <small class="text-muted fs-11">Live in catalog</small>
    </div>
  </div>

  <!-- Card 3: Associated Categories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Categories</span>
        <div class="cat-metric-icon bg-info-subtle text-info">
          <iconify-icon icon="solar:folder-with-files-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ categoriesCount }}</div>
      <small class="text-muted fs-11">Product departments</small>
    </div>
  </div>

  <!-- Card 4: Catalog SKUs -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Catalog SKUs</span>
        <div class="cat-metric-icon bg-warning-subtle text-warning">
          <iconify-icon icon="solar:box-minimalistic-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ totalBrandProducts | number }}</div>
      <small class="text-muted fs-11">Branded products online</small>
    </div>
  </div>
</div>
