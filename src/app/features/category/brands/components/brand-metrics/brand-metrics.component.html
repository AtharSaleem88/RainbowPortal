<div class="row g-2 g-md-3 mb-3">
  <!-- Card 1: Total Brands -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">All Brands</span>
        <div class="cat-metric-icon bg-primary-subtle text-primary">
          <iconify-icon icon="solar:shop-2-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ brandsCount }}</div>
      <small class="text-muted metric-subtext d-none d-sm-block">Registered manufacturers</small>
    </div>
  </div>

  <!-- Card 2: Active Brands -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Active Brands</span>
        <div class="cat-metric-icon bg-success-subtle text-success">
          <iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ activeBrandsCount }}</div>
      <small class="text-muted metric-subtext d-none d-sm-block">Live in catalog</small>
    </div>
  </div>

  <!-- Card 3: Associated Categories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Categories</span>
        <div class="cat-metric-icon bg-info-subtle text-info">
          <iconify-icon icon="solar:folder-with-files-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ categoriesCount }}</div>
      <small class="text-muted metric-subtext d-none d-sm-block">Product departments</small>
    </div>
  </div>

  <!-- Card 4: Catalog SKUs -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Catalog SKUs</span>
        <div class="cat-metric-icon bg-warning-subtle text-warning">
          <iconify-icon icon="solar:box-minimalistic-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ totalBrandProducts | number }}</div>
      <small class="text-muted metric-subtext d-none d-sm-block">Linked brand items</small>
    </div>
  </div>
</div>
