<div class="card border-0 shadow-sm mb-3">
  <div class="card-header bg-white py-3 border-bottom">
    <h4 class="card-title mb-0 fw-bold text-dark">Category General Information</h4>
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-lg-6">
        <div class="mb-3">
          <label for="category-title" class="form-label fw-semibold">Category Title</label>
          <input type="text" id="category-title" class="form-control" placeholder="Enter Category Title" value="Frozen Food">
        </div>
      </div>

      <div class="col-lg-6">
        <div class="mb-3">
          <label for="crater" class="form-label fw-semibold">Created By</label>
          <app-themed-select id="crater" ariaLabel="Created by" [options]="creatorOptions" [(ngModel)]="createdBy" />
        </div>
      </div>
      <div class="col-lg-6">
        <div class="mb-3">
          <label for="product-stock" class="form-label fw-semibold">Active Catalog SKUs</label>
          <input type="number" id="product-stock" class="form-control" placeholder="Quantity" value="185">
        </div>
      </div>
      <div class="col-lg-6">
        <div class="mb-3">
          <label for="product-id" class="form-label fw-semibold">SKU Prefix Code</label>
          <input type="text" id="product-id" class="form-control" placeholder="e.g. RW-FRZ" value="RW-FRZ">
        </div>
      </div>
      <div class="col-lg-12">
        <div class="mb-0">
          <label for="description" class="form-label fw-semibold">Description</label>
          <textarea class="form-control bg-light-subtle" id="description" rows="4" placeholder="Type category description">Chicken nuggets, shashlik, chapli kababs, parathas, frozen veggies, and ice creams. Maintained in continuous cold chain below -18°C across all 10 Rainbow Superstores.</textarea>
        </div>
      </div>
    </div>
  </div>
</div>
