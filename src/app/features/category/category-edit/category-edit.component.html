@if (activeModal) {
  <div class="modal-header px-4 py-3">
    <h5 id="edit-master-category-title" class="modal-title fw-bold fs-16">Edit Master Category</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
  </div>
} @else {
<!-- Header & Navigation -->
<div class="d-flex flex-wrap align-items-center justify-content-end gap-3 mb-3">
  <a routerLink="/category/list" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1.5 py-1.5 px-3 fs-12 cursor-pointer">
    <iconify-icon icon="solar:arrow-left-linear" class="fs-15"></iconify-icon>
    <span>Back to Categories</span>
  </a>
</div>

}

<!-- Category Form -->
    <div class="p-4" [class.cat-form-card]="!activeModal" [class.modal-body]="activeModal">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h5 class="fs-15 fw-bold text-dark mb-0 font-jost">Category Details</h5>
        <span class="badge bg-light text-muted border font-monospace fs-11">{{ category.id }}</span>
      </div>

      <form (ngSubmit)="saveCategory()">
        <div class="row g-3">
          
          <!-- Category Name -->
          <div class="col-md-8 col-12">
            <label class="form-label fs-12 fw-semibold text-dark mb-1">Category Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control form-control-sm fs-13" 
                   [(ngModel)]="category.name" name="name" required>
            <small class="text-muted fs-11">The primary department name</small>
          </div>

          <!-- Status -->
          <div class="col-md-4 col-12">
            <label class="form-label fs-12 fw-semibold text-dark mb-1">Status</label>
            <select class="form-select form-select-sm fs-12" [(ngModel)]="category.status" name="status">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
            <small class="text-muted fs-11">Visibility in catalog</small>
          </div>

          <!-- Image URL -->
          <div class="col-12">
            <label class="form-label fs-12 fw-semibold text-dark mb-1">Category Thumbnail Image URL</label>
            <input type="text" class="form-control form-control-sm fs-12" 
                   [(ngModel)]="category.image" name="image">
            <small class="text-muted fs-11">Direct image URL for department icon/thumbnail</small>
          </div>

          <!-- Description -->
          <div class="col-12">
            <label class="form-label fs-12 fw-semibold text-dark mb-1">Description</label>
            <textarea class="form-control fs-12" rows="3" 
                      [(ngModel)]="category.description" name="description"></textarea>
          </div>

        </div>

        <!-- Form Actions -->
        <div class="d-flex align-items-center justify-content-end gap-2 mt-4 pt-3 border-top">
          <button type="button" (click)="cancel()" class="btn btn-sm btn-outline-secondary px-3 fs-12 cursor-pointer">
            Cancel
          </button>
          <button type="submit" [disabled]="saving" class="btn btn-sm btn-primary px-4 fs-12 cursor-pointer"
                  style="background: #2e3192; border-color: #2e3192;">
            <iconify-icon icon="solar:check-circle-bold" class="fs-15 align-middle me-1"></iconify-icon>
            Save Changes
          </button>
        </div>
      </form>
    </div>
