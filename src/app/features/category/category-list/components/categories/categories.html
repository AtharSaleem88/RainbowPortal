<div class="row g-2 g-md-3 mb-3">
  <!-- Card 1: Master Categories -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Master Depts</span>
        <div class="cat-metric-icon bg-primary-subtle text-primary">
          <iconify-icon icon="solar:widget-2-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ totalDepartments }}</div>
      <small class="text-muted metric-subtext d-none d-sm-block">Primary store divisions</small>
    </div>
  </div>

  <!-- Card 2: Active Departments -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Active Status</span>
        <div class="cat-metric-icon bg-success-subtle text-success">
          <iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ activeDepartments }} <span class="fs-12 text-muted fw-normal d-none d-sm-inline">Live</span></div>
      <small class="text-muted metric-subtext d-none d-sm-block">Consumer catalog visible</small>
    </div>
  </div>

  <!-- Card 3: Sub Categories -->
  <div class="col-6 col-lg-3">
    <a routerLink="/category/sub-category" class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Subcategories</span>
        <div class="cat-metric-icon bg-info-subtle text-info">
          <iconify-icon icon="solar:layers-minimalistic-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ totalSubCategories }}</div>
      <small class="text-muted metric-subtext d-none d-sm-block">Across 20 departments</small>
    </a>
  </div>

  <!-- Card 4: Total Products -->
  <div class="col-6 col-lg-3">
    <a routerLink="/product/list" class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-1 mb-md-2">
        <span class="metric-label text-uppercase text-muted">Catalog SKUs</span>
        <div class="cat-metric-icon bg-warning-subtle text-warning">
          <iconify-icon icon="solar:box-minimalistic-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="metric-value fw-bold text-dark font-jost mb-0">{{ totalProducts | number }}</div>
      <small class="text-muted metric-subtext d-none d-sm-block">Registered items</small>
    </a>
  </div>
</div>
