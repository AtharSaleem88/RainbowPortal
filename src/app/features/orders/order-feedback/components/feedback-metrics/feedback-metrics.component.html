<div class="row g-3 mb-3">
  <!-- Card 1: Average Rating -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Average Rating</span>
        <div class="cat-metric-icon bg-warning-subtle text-warning">
          <iconify-icon icon="solar:star-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="d-flex align-items-baseline gap-2">
        <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ counts.averageRating }}</div>
        <div class="text-warning fs-13 d-flex align-items-center">
          <iconify-icon icon="solar:star-bold"></iconify-icon>
          <iconify-icon icon="solar:star-bold"></iconify-icon>
          <iconify-icon icon="solar:star-bold"></iconify-icon>
          <iconify-icon icon="solar:star-bold"></iconify-icon>
          <iconify-icon icon="solar:star-bold"></iconify-icon>
        </div>
      </div>
      <small class="text-muted fs-11">Storefront rating score</small>
    </div>
  </div>

  <!-- Card 2: Pending Moderation -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Pending Moderation</span>
        <div class="cat-metric-icon bg-warning-subtle text-warning">
          <iconify-icon icon="solar:clock-circle-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ counts.pending }}</div>
      <small class="text-muted fs-11">Awaiting approval</small>
    </div>
  </div>

  <!-- Card 3: Live on Storefront -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Live on Storefront</span>
        <div class="cat-metric-icon bg-success-subtle text-success">
          <iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ counts.approved }}</div>
      <small class="text-muted fs-11">Published customer reviews</small>
    </div>
  </div>

  <!-- Card 4: Total Reviews -->
  <div class="col-6 col-lg-3">
    <div class="cat-metric-card">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fs-12 fw-bold text-uppercase text-muted" style="letter-spacing: 0.5px;">Total Reviews</span>
        <div class="cat-metric-icon bg-primary-subtle text-primary">
          <iconify-icon icon="solar:chat-square-like-bold-duotone"></iconify-icon>
        </div>
      </div>
      <div class="fs-22 fw-bold text-dark font-jost mb-0">{{ counts.all }}</div>
      <small class="text-muted fs-11">{{ counts.rejected }} reviews hidden/rejected</small>
    </div>
  </div>
</div>
