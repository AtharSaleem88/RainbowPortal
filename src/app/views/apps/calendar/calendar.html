<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="row">
          <div class="col-xl-3">
            <div class="d-grid">
              <button type="button" class="btn btn-primary" (click)="createEvent()" id="btn-new-event">
                <i class="bx bx-plus fs-18 me-2"></i>
                Add New Schedule
              </button>
            </div>
            <div id="external-events">
              <br />
              <p class="text-muted">
                Drag and drop your event or click in the calendar
              </p>
              @for (data of externalEvents; track $index) {
              <div class="external-event bg-soft-{{ data.className }} {{
                    data.textClass
                  }}" [id]="'bg-' + data.className">
                <i class="bx bxs-circle me-2 vertical-middle"></i>{{ data.title }}
              </div>
              }
            </div>
          </div>
          

          <div class="col-xl-9">
            <div class="mt-4 mt-lg-0">
              <div id="calendar">
                <full-calendar [options]="calendarOptions" [events]="this.calendarEvents"></full-calendar>
              </div>
            </div>
          </div>
        </div>
      </div>
      
    </div>

    <ng-template #modalShow let-modal id="event-modal" tabindex="-1">
      <form [formGroup]="formData" (ngSubmit)="saveEvent()" class="needs-validation" name="event-form" id="forms-event" novalidate>
        <div class="modal-header border-bottom py-3 px-4 bg-white d-flex align-items-center justify-content-between">
          <h5 class="modal-title fw-bold text-dark mb-0 fs-16 font-jost" id="modal-title">
            {{ isEditMode ? 'Edit Event' : 'Add New Event' }}
          </h5>
          <button type="button" class="btn-close cursor-pointer" (click)="modal.dismiss('Cross click')" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div class="row">
            <div class="col-12">
              <div class="mb-3">
                <label class="control-label form-label">Event Name</label>
                <input class="form-control" placeholder="Insert Event Name" type="text" formControlName="title" id="event-title" required />
                <div class="invalid-feedback">
                  Please provide a valid event name
                </div>
              </div>
            </div>
            <div class="col-12">
              <div class="mb-3">
                <label class="control-label form-label">Category</label>
                <select class="form-select" formControlName="className" id="event-category" required>
                  <option value="bg-primary">Blue</option>
                  <option value="bg-secondary">Gray Dark</option>
                  <option value="bg-success">Green</option>
                  <option value="bg-info">Cyan</option>
                  <option value="bg-warning">Yellow</option>
                  <option value="bg-danger">Red</option>
                  <option value="bg-dark">Dark</option>
                </select>
                <div class="invalid-feedback">
                  Please select a valid event category
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer border-top py-2.5 px-4 bg-light d-flex justify-content-between align-items-center">
          <div>
            @if (isEditMode) {
            <button type="button" (click)="deleteEvent()" class="btn btn-sm btn-outline-danger fs-12 cursor-pointer px-3" id="btn-delete-event">
              Delete
            </button>
            }
          </div>
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary fs-12 cursor-pointer px-3" (click)="modal.dismiss('Cross click')">
              Close
            </button>
            <button type="submit" class="btn btn-sm btn-primary fs-12 cursor-pointer px-3" style="background: #2e3192; border-color: #2e3192;" id="btn-save-event">
              Save
            </button>
          </div>
        </div>
      </form>
    </ng-template>
    
  </div>
</div>
